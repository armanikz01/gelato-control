<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gelato Control</title>
<meta name="theme-color" content="#185A4B">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* VOICE work: учётная система, спокойная и точная
   IDEA премиальная витрина джелатерии: тёплый фон, изумруд, фисташковые и персиковые карточки
   PICTURE на главной — финансовые карточки и график выручки; в кассе — сетка товаров и чек
   COLOUR фон #F4F0E7, изумруд #185A4B, фисташка #E3EBDA, персик #F0DCCB, бронза #B18B59, лаванда #8A9BCE
   TYPE Manrope 800 для заголовков и цифр, Manrope 400–600 для текста
   LAYOUT ноутбук: боковое меню + рабочая область; телефон: нижнее меню, одна колонка */
:root{color-scheme:light dark;
--bg:light-dark(#F4F0E7,#13201c);--panel:light-dark(#fffdf8,#1b2a25);--ink:light-dark(#1d2a26,#eef0ea);--mute:light-dark(#66706a,#a9b3ad);
--em:light-dark(#185A4B,#5fbf9f);--emk:light-dark(#fff,#0d1a16);--pis:light-dark(#E3EBDA,#24382f);--pea:light-dark(#F0DCCB,#3a2c22);--bro:light-dark(#B18B59,#d0aa76);--lav:light-dark(#8A9BCE,#a3b2e0);--lavb:light-dark(#e6e9f5,#262c40);
--line:light-dark(#e3ddd0,#2c3d37);--bad:light-dark(#b3402a,#ef8a72);--good:light-dark(#185A4B,#5fbf9f)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Manrope,system-ui,sans-serif;overflow-x:clip}
button,input,select,textarea{font:inherit;color:inherit}
.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100%}
.side{background:var(--em);color:#fff;padding:22px 14px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{font-weight:800;font-size:21px;letter-spacing:-.02em;padding:0 10px 4px}
.brand small{display:block;font-weight:500;font-size:12px;opacity:.7;letter-spacing:0}
.nav a{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;color:#fff;text-decoration:none;opacity:.82;font-weight:600}
.nav a:hover{opacity:1;background:rgba(255,255,255,.08)}
.nav a.on{opacity:1;background:rgba(255,255,255,.16)}
.nav svg{width:18px;height:18px;flex:none}
.who{margin-top:auto;font-size:12px;opacity:.8;padding:10px}
main{padding:24px clamp(16px,3vw,36px) 90px;max-width:1320px;width:100%}
h1{font-size:clamp(26px,3.2vw,36px);line-height:1.05;letter-spacing:-.02em;margin:0;font-weight:800}
h2{font-size:18px;margin:0 0 12px;font-weight:800;letter-spacing:-.01em}
.top{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-bottom:18px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr))}
.kpis{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));margin-bottom:14px}
.k{border-radius:16px;padding:16px;background:var(--panel);border:1px solid var(--line)}
.k.em{background:var(--em);color:var(--emk);border-color:transparent}
.k.pis{background:var(--pis)}.k.pea{background:var(--pea)}.k.lav{background:var(--lavb)}
.k b{display:block;font-size:clamp(20px,2.2vw,26px);font-weight:800;letter-spacing:-.02em;white-space:nowrap}
.k span{font-size:13px;opacity:.8}
.seg{display:inline-flex;flex-wrap:wrap;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:3px;gap:2px}
.seg button{border:0;background:none;padding:7px 11px;border-radius:9px;cursor:pointer;font-weight:600;font-size:13px;min-height:34px}
.seg button.on{background:var(--em);color:var(--emk)}
.btn{border:1px solid var(--line);background:var(--panel);padding:9px 14px;border-radius:11px;cursor:pointer;font-weight:700;min-height:40px}
.btn.p{background:var(--em);color:var(--emk);border-color:var(--em)}
.btn.s{padding:5px 10px;min-height:32px;font-size:13px}
.btn.d{color:var(--bad)}
.btn:disabled{opacity:.45;cursor:default}
.btn:focus-visible,.seg button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--bro);outline-offset:2px}
input,select,textarea{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:8px 10px;min-height:40px;font-size:16px;width:100%}
label{display:grid;gap:4px;font-size:13px;font-weight:600;color:var(--mute)}
.f{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-size:12px;color:var(--mute);font-weight:700;padding:8px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:top}
td.n,th.n{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
tr.x td{opacity:.45;text-decoration:line-through}
.mute{color:var(--mute);font-size:13px}
.tag{display:inline-block;font-size:12px;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--pis);white-space:nowrap}
.tag.w{background:var(--pea)}.tag.b{background:var(--lavb)}.tag.r{background:color-mix(in srgb,var(--bad) 18%,transparent);color:var(--bad)}
.bars{display:flex;align-items:flex-end;gap:3px;height:190px;padding-top:18px}
.bars div{flex:1;background:var(--em);border-radius:5px 5px 0 0;min-height:2px;position:relative}
.bars div:hover::after{content:attr(data-t);position:absolute;bottom:100%;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);font-size:12px;padding:3px 7px;border-radius:6px;white-space:nowrap;z-index:2}
.axis{display:flex;justify-content:space-between;font-size:12px;color:var(--mute);margin-top:6px}
.hb{display:grid;grid-template-columns:minmax(90px,160px) minmax(0,1fr) auto;gap:10px;align-items:center;font-size:14px;margin:7px 0}
.hb i{display:block;height:12px;border-radius:6px;background:var(--bro)}
.hb b{white-space:nowrap;font-variant-numeric:tabular-nums}
.pos{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:14px;align-items:start}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.tile{border:1px solid var(--line);background:var(--panel);border-radius:14px;padding:12px;text-align:left;cursor:pointer;display:grid;gap:4px;min-height:96px}
.tile:hover{border-color:var(--em)}
.tile b{font-size:14px;line-height:1.25}
.tile .pr{font-weight:800;font-size:16px}
.tile.ice{background:linear-gradient(180deg,var(--pis),var(--panel) 70%)}.tile.subl{background:linear-gradient(180deg,var(--pea),var(--panel) 70%)}.tile.nuts{background:linear-gradient(180deg,var(--lavb),var(--panel) 70%)}
.cart{position:sticky;top:16px}
.cl{display:grid;grid-template-columns:minmax(0,1fr) 84px 96px 28px;gap:6px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line);font-size:14px}
.cl input{min-height:34px;padding:4px 6px;font-size:15px}
.x{border:0;background:none;cursor:pointer;color:var(--mute);font-size:18px;min-height:32px}
.tot{display:flex;justify-content:space-between;font-weight:800;font-size:24px;margin:12px 0}
.lines{display:grid;gap:8px}
.ln{display:grid;gap:6px;grid-template-columns:repeat(auto-fit,minmax(110px,1fr)) 36px;align-items:end;padding:10px;border:1px dashed var(--line);border-radius:12px}
dialog{border:0;border-radius:18px;padding:0;width:min(860px,96vw);max-height:92vh;background:var(--bg);color:var(--ink);box-shadow:0 20px 60px rgba(0,0,0,.25)}
dialog::backdrop{background:rgba(10,25,20,.45)}
.mh{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:1}
.mb{padding:18px 20px;display:grid;gap:14px}
.mf{display:flex;gap:8px;justify-content:flex-end;padding:14px 20px;border-top:1px solid var(--line);position:sticky;bottom:0;background:var(--bg);flex-wrap:wrap}
.err{color:var(--bad);font-weight:700;font-size:14px}
.note{background:var(--pea);border-radius:12px;padding:10px 14px;font-size:14px}
.toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:700;z-index:99;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
.empty{padding:28px;text-align:center;color:var(--mute)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
@media(max-width:900px){.pos{grid-template-columns:minmax(0,1fr)}.cart{position:static}}
@media(max-width:760px){
.app{grid-template-columns:minmax(0,1fr)}
.side{position:fixed;bottom:0;top:auto;left:0;right:0;height:auto;flex-direction:row;padding:6px;z-index:20;overflow-x:auto}
.brand,.who{display:none}
.nav{display:flex;gap:2px}
.nav a{flex-direction:column;gap:2px;font-size:11px;padding:6px 8px;white-space:nowrap}
main{padding:16px 16px 100px}
table{font-size:13px}th,td{padding:6px 5px}
.stack thead{display:none}.stack tr{display:grid;padding-block:8px;border-bottom:1px solid var(--line)}.stack td{display:flex;justify-content:space-between;gap:12px;border:0;padding:3px 4px;text-align:right}.stack td::before{content:attr(data-l);color:var(--mute);font-size:12px;text-align:left}
}
@media(prefers-reduced-motion:reduce){.toast{transition:none}}
</style>
</head>
<body>
<div class="app">
<aside class="side"><div class="brand">Gelato Control<small>Мороженое · Сублиматы · Орехи</small></div><nav class="nav" id="nav"></nav><div class="who" id="who"></div></aside>
<main id="main"><div class="empty">Загрузка данных…</div></main>
</div>
<dialog id="dlg"><form id="mform" method="dialog"><div class="mh"><h2 id="mt" style="margin:0"></h2><button type="button" class="x" data-act="close" aria-label="Закрыть">✕</button></div><div class="mb" id="mbody"></div><div class="mf"><span class="err" id="merr" style="margin-right:auto"></span><button type="button" class="btn" data-act="close">Отмена</button><button type="submit" class="btn p" id="mok">Провести</button></div></form></dialog>
<div class="toast" id="toast"></div>
<script>
{
const $=s=>document.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const NF=new Intl.NumberFormat('ru-RU',{maximumFractionDigits:0}),NF2=new Intl.NumberFormat('ru-RU',{maximumFractionDigits:2}),NF3=new Intl.NumberFormat('ru-RU',{maximumFractionDigits:3});
const m=v=>NF.format(Math.round(v||0))+' ₸';
const r2=v=>Math.round((v||0)*100)/100;
const LINES={ice:'Мороженое',subl:'Сублиматы',nuts:'Орехи'};
const SUBS={ice:['Джелато','Сорбеты'],subl:['Сублиматы'],nuts:['Кедровые орехи','Тыквенные семечки']};
const KINDS={finished:'Готовая продукция',ingredient:'Ингредиент',raw:'Сырьё на фасовку',semi:'Полуфабрикат (смесь)',packaging:'Упаковка и этикетки',material:'Материалы'};
const FMT={ice:[['240 мл',190],['500 мл',400],['1 кг',1000],['2,4 кг',2400],['4 кг',4000],['шарик',50]],subl:[['500 г',500],['1 кг',1000]],nuts:[['500 г',500],['1 кг',1000]]};
const U={g:{l:'кг',k:1000},ml:{l:'л',k:1000},pcs:{l:'шт',k:1}};
const uk=u=>(U[u]||U.pcs).k,ul=u=>(U[u]||U.pcs).l;
const ROLES={owner:'Владелец',admin:'Администратор',prod:'Производство',packer:'Фасовщик',store:'Кладовщик',seller:'Продавец',acct:'Бухгалтер'};
const TYPES={buy:'Закупка',spay:'Оплата поставщику',prod:'Производство',pack:'Фасовка',move:'Перемещение',wo:'Списание',inv:'Инвентаризация',open:'Начальные остатки',sale:'Продажа',payout:'Выплата площадки',cpay:'Оплата клиента',exp:'Расход',epay:'Оплата начисления',mtr:'Перевод денег',ret:'Возврат',asset:'Оборудование',shift:'Кассовая смена',cdiff:'Расхождение кассы'};
const ALL=Object.keys(ROLES);
const NAV=[
['home','Главная','M3 12l9-8 9 8M5 10v10h14V10',['owner','admin','acct']],
['sale','Касса','M4 7h16v13H4zM8 7V4h8v3M8 13h8',['owner','admin','seller']],
['stock','Склад','M3 8l9-5 9 5v12H3zM3 8h18M9 20v-7h6v7',ALL],
['prod','Производство','M6 3h12l-2 7H8zM8 10v11h8V10',['owner','admin','prod','packer']],
['buy','Закупки','M3 4h3l3 12h10l2-8H7M10 20h.01M17 20h.01',['owner','admin','store','acct']],
['fin','Финансы','M3 6h18v12H3zM3 10h18M7 15h3',['owner','admin','acct']],
['rep','Аналитика','M4 20V10M10 20V4M16 20v-7M2 20h20',['owner','admin','acct']],
['log','Журнал','M6 3h12v18H6zM9 8h6M9 12h6M9 16h4',ALL],
['ref','Справочники','M4 4h16v4H4zM4 10h16v4H4zM4 16h16v4H4z',['owner','admin']],
['set','Настройки','M12 8a4 4 0 100 8 4 4 0 000-8zM12 2v3M12 19v3M2 12h3M19 12h3',['owner']]];
const COLS=['items','whs','parties','channels','pays','accounts','expcats','recipes','members','campaigns','templates'];
const S={db:null,user:null,uid:null,owner:false,role:'seller',cfg:{roles:{}},ops:[],arch:[],names:{},loaded:{},view:'home',per:'month',from:'',to:'',line:'all',cart:[],pay:[],q:'',sCh:'',sW:'',sSrc:'',sCust:'',stW:'',logT:'',logQ:'',repT:'pl',repW:'',sCamp:'',refT:'items',finT:'acc',dirty:false,timer:null,err:''};
COLS.forEach(c=>S[c]=[]);
let E={lots:{},bal:{},money:{},cdebt:{},sdebt:{},recv:{},eunp:{}};
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const addD=(s,n)=>{const d=new Date(s+'T12:00');d.setDate(d.getDate()+n);return d.toISOString().slice(0,10)};
const dd=s=>s?s.slice(8,10)+'.'+s.slice(5,7)+'.'+s.slice(2,4):'—';
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const byId=(c,id)=>S[c].find(x=>x.id===id);
const iname=id=>byId('items',id)?.name||'—';
const can=r=>r.includes(S.role);
const seeCost=()=>['owner','admin','acct'].includes(S.role);
const toast=t=>{const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('on'),2600)};
const opts=(list,sel,empty)=>(empty!==undefined?`<option value="">${esc(empty)}</option>`:'')+list.map(o=>`<option value="${esc(o.id)}"${o.id===sel?' selected':''}>${esc(o.name)}</option>`).join('');
const allOps=()=>{const seen=new Set(),out=[];for(const o of S.ops){seen.add(o.id);out.push(o)}for(const a of S.arch)for(const o of a.ops||[])if(!seen.has(o.id)){seen.add(o.id);out.push({...o,arch:1})}return out.sort((a,b)=>(a.date+a.ts).localeCompare(b.date+b.ts))};

/* ---------- движок: остатки, деньги, долги ---------- */
function rebuild(){
 const e={lots:{},bal:{},money:{},cdebt:{},sdebt:{},recv:{},eunp:{}};
 for(const o of allOps()){
  if(o.cancelled)continue;
  for(const s of o.stock||[]){if(s.nl)e.lots[s.lot]={item:s.item,exp:s.exp||'',cost:s.cost,rec:o.date,w:s.w};const k=s.w+'|'+s.lot;e.bal[k]=(e.bal[k]||0)+s.qty}
  for(const x of o.money||[])e.money[x.acc]=(e.money[x.acc]||0)+x.amt;
  if(o.type==='sale'){if(o.debt>0.004)e.cdebt[o.cust]=(e.cdebt[o.cust]||0)+o.debt;if(o.plat)e.recv[o.ch]=(e.recv[o.ch]||0)+o.total}
  if(o.type==='cpay')e.cdebt[o.cust]=(e.cdebt[o.cust]||0)-o.amt;
  if(o.type==='payout')e.recv[o.ch]=(e.recv[o.ch]||0)-o.gross;
  if(o.type==='ret'){if(o.mode==='debt')e.cdebt[o.cust]=(e.cdebt[o.cust]||0)-o.amt;if(o.mode==='platform')e.recv[o.ch]=(e.recv[o.ch]||0)-o.amt}
  if(o.type==='buy'&&!o.acc)e.sdebt[o.party]=(e.sdebt[o.party]||0)+o.goods;
  if(o.type==='spay')e.sdebt[o.party]=(e.sdebt[o.party]||0)-o.amt;
  if(o.type==='exp'&&!o.acc)e.eunp[o.id]={op:o,left:o.amt};
  if(o.type==='epay'&&e.eunp[o.ref])e.eunp[o.ref].left-=o.amt;
 }
 for(const k in e.eunp)if(e.eunp[k].left<0.01)delete e.eunp[k];
 E=e;
}
function lotsOf(w,item){const r=[];for(const k in E.bal){if(E.bal[k]<=1e-6)continue;const[ww,lot]=k.split('|');if(ww!==w)continue;const L=E.lots[lot];if(L&&L.item===item)r.push({lot,qty:E.bal[k],...L})}return r.sort((a,b)=>(a.exp||'9999').localeCompare(b.exp||'9999')||a.rec.localeCompare(b.rec))}
function stockQty(w,item){return lotsOf(w,item).reduce((s,l)=>s+l.qty,0)}
function fefo(w,item,qty,expired){
 const t=today();let need=qty;const out=[];
 for(const l of lotsOf(w,item)){if(need<=1e-9)break;if(!expired&&l.exp&&l.exp<t)continue;const q=Math.min(need,l.qty);out.push({lot:l.lot,qty:q,cost:l.cost});need-=q}
 if(need>1e-6){const it=byId('items',item);throw new Error(`Не хватает «${it?.name||item}» на складе «${byId('whs',w)?.name||''}»: нужно ${NF3.format(qty/uk(it?.unit))} ${ul(it?.unit)}, доступно ${NF3.format((qty-need)/uk(it?.unit))}`)}
 return out;
}
const outMoves=(w,item,picks)=>picks.map(p=>({w,lot:p.lot,item,qty:-p.qty,cost:p.cost}));

/* ---------- период и прибыль ---------- */
function range(){const t=today();switch(S.per){case'today':return[t,t];case'yest':{const y=addD(t,-1);return[y,y]}case'week':return[addD(t,-6),t];case'month':return[t.slice(0,8)+'01',t];case'year':return[t.slice(0,5)+'01-01',t];default:return[S.from||t.slice(0,8)+'01',S.to||t]}}
function pl(from,to){
 const r={rev:{},cogs:{},comm:{},wo:{},opex:{},tax:{},ch:{},src:{},days:{},n:0};
 for(const o of allOps()){if(o.cancelled||o.date<from||o.date>to)continue;
  if(o.type==='sale'){r.n++;r.ch[o.ch]=(r.ch[o.ch]||0)+o.total;const sk=o.src||'';r.src[sk]=(r.src[sk]||0)+o.total}
  if(o.type==='ret')r.ch[o.ch]=(r.ch[o.ch]||0)-o.amt;
  for(const p of o.pl||[]){const l=p.l||'';r[p.a][l]=(r[p.a][l]||0)+p.v;if(p.a==='rev')r.days[o.date]=(r.days[o.date]||0)+p.v}}
 r.amort=0;for(const o of allOps()){if(o.cancelled||o.type!=='asset')continue;const per=o.amt/o.months;let d=o.date.slice(0,7)+'-01';for(let i=0;i<o.months&&d<=to;i++){if(d>=from){r.opex[o.l||'']=(r.opex[o.l||'']||0)-per;r.amort+=per}d=addM(d)}}
 return r;
}
const addM=s=>{const[y,mm]=s.split('-').map(Number);const n=new Date(y,mm,1);return n.getFullYear()+'-'+String(n.getMonth()+1).padStart(2,'0')+'-01'};
function lineView(r,L){
 const sum=o=>Object.values(o).reduce((a,b)=>a+b,0);
 const revAll=sum(r.rev)-(r.rev['']||0);
 const al=S.cfg.alloc||{},share=al.mode==='pct'?(+(al.pct||{})[L]||0)/100:(revAll>0?(r.rev[L]||0)/revAll:0);
 const pick=o=>L==='all'?sum(o):(o[L]||0)+(o['']||0)*share;
 const rev=L==='all'?sum(r.rev):(r.rev[L]||0);
 const cogs=-(L==='all'?sum(r.cogs):(r.cogs[L]||0)),comm=-(L==='all'?sum(r.comm):(r.comm[L]||0)),wo=-(L==='all'?sum(r.wo):(r.wo[L]||0));
 const opex=-pick(r.opex),tax=-pick(r.tax);
 const gross=rev-cogs,pbt=gross-comm-wo-opex;
 return{rev,cogs,comm,wo,opex,tax,gross,pbt,net:pbt-tax};
}

 buy:()=>`<div class="ln"><label>Позиция<select data-k="item">${itemSel(i=>i.kind!=='finished')}</select></label><label>Кол-во (кг/л/шт)<input data-k="qty" type="number" step="any"></label><label>Цена за ед. в валюте<input data-k="price" type="number" step="any"></label><label>Годен до<input data-k="exp" type="date"></label><button type="button" class="x" data-del aria-label="Удалить">✕</button></div>`,

 open:()=>`<div class="ln"><label>Склад<select data-k="w">${opts(S.whs)}</select></label><label>Позиция<select data-k="item">${itemSel()}</select></label><label>Кол-во (кг/л/шт)<input data-k="qty" type="number" step="any"></label><label>Себест. за ед., ₸<input data-k="cost" type="number" step="any"></label><label>Годен до<input data-k="exp" type="date"></label><button type="button" class="x" data-del aria-label="Удалить">✕</button></div>`,

async function post(op){
 const id=uid();op.id=id;op.no=mkNo(op.type);op.ts=new Date().toISOString();op.by=S.uid||'';op.date=op.date||today();
 await S.db.collection('ops').doc(id).set(JSON.parse(JSON.stringify(op)));
 return op;

const defW=t=>(S.whs.find(w=>w.type===t)||S.whs[0])?.id;

function form(kind,arg){
 const ice=S.whs.find(w=>w.type==='production')?.id;
 if(kind==='buy')return openM('Новая закупка',head(`${fDate}<label>Поставщик<select id="fp">${opts(S.parties.filter(p=>p.kind!=='customer'),'','— выберите —')}</select></label>${whSel('fw',ice,'Склад прихода')}<label>Валюта<select id="fc">${['KZT','CNY','RUB','USD'].map(c=>`<option>${c}</option>`).join('')}</select></label><label>Курс к тенге<input id="fr" type="number" step="any" value="1"></label>`)+
  `<h2 style="margin:0">Товары</h2>`+rowsBox('l',TPL.buy(),'buy')+`<h2 style="margin:0">Карго и доп. расходы</h2>`+rowsBox('x','','extra')+
  head(`<label>Распределить доп. расходы<select id="fa"><option value="value">по стоимости</option><option value="weight">по массе</option></select></label>${accSel('facc','Оплата товара','В долг поставщику')}${accSel('feacc','Доп. расходы оплачены с','— счёт —')}`)+`<p class="mute">Курс один на всю закупку: им пересчитываются и товар, и оплата. Себестоимость партии = товар в тенге + доля доп. расходов.</p>`,'Оприходовать',async()=>{
  const rate=num('fr')||1,cur=val('fc'),w=val('fw'),party=val('fp');if(!party)throw new Error('Выберите поставщика');
  const lines=rowsOf('l').map(r=>{const it=byId('items',rv(r,'item'));return it&&rn(r,'qty')>0?{item:it.id,unit:it.unit,qty:rn(r,'qty')*uk(it.unit),price:rn(r,'price'),amtCur:r2(rn(r,'qty')*rn(r,'price')),exp:rv(r,'exp')}:null}).filter(Boolean);
  if(!lines.length)throw new Error('Добавьте хотя бы одну позицию с количеством');
  const extras=rowsOf('x').map(r=>({name:rv(r,'name'),amt:rn(r,'amt')})).filter(x=>x.amt>0),extra=r2(extras.reduce((a,x)=>a+x.amt,0));
  if(extra>0&&!val('feacc'))throw new Error('Укажите, с какого счёта оплачены доп. расходы');
  lines.forEach(l=>l.kzt=r2(l.amtCur*rate));
  const byW=val('fa')==='weight'&&lines.some(l=>l.unit!=='pcs'),base=lines.reduce((a,l)=>a+(byW?(l.unit!=='pcs'?l.qty:0):l.kzt),0)||1;
  let left=extra;lines.forEach((l,i)=>{const sh=i===lines.length-1?left:r2(extra*(byW?(l.unit!=='pcs'?l.qty:0):l.kzt)/base);left=r2(left-sh);l.alloc=sh;l.cost=(l.kzt+sh)/l.qty});
  const goods=r2(lines.reduce((a,l)=>a+l.kzt,0)),acc=val('facc');
  const op={type:'buy',date:val('fd'),party,cur,rate,w,lines,extras,extra,goods,acc,title:byId('parties',party)?.name,stock:[],money:[],pl:[]};
  op.stock=lines.map((l,i)=>({w,lot:'L'+uid()+i,item:l.item,qty:l.qty,cost:l.cost,nl:1,exp:l.exp}));

async function archive(month){
 const list=S.ops.filter(o=>o.date.startsWith(month));if(!list.length)return;
 const chunks=[[]];let size=0;for(const o of list){const s=JSON.stringify(o).length;if(size+s>180000){chunks.push([]);size=0}chunks[chunks.length-1].push(o);size+=s}
 for(let i=0;i<chunks.length;i++)await S.db.collection('archive').doc(month+'-'+i+'-'+uid()).set({month,ops:chunks[i]});
 for(const o of list)await S.db.collection('ops').doc(o.id).delete();
 toast(`Месяц ${month}: ${list.length} операций в архиве`);
}

const IMPCOLS=['Наименование','Вид','Направление','Подкатегория','Единица','Масса нетто, г','Цена, ₸','Штрихкод','Срок годности, дней'];
async function impTemplate(){await loadJs('https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js');const ws=XLSX.utils.aoa_to_sheet([IMPCOLS,['Фисташка 500 мл','Готовая продукция','Мороженое','Джелато','шт',400,3500,'',90],['Сахар','Ингредиент','Мороженое','','кг','','','',365],['Клубника сублимированная','Сырьё на фасовку','Сублиматы','','кг','','','',540],['Стакан 500 мл','Упаковка','','','шт','','','','']]);ws['!cols']=IMPCOLS.map(h=>({wch:Math.max(14,h.length+2)}));const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'Товары');await saveFile('Шаблон импорта товаров.xlsx',new Uint8Array(XLSX.write(wb,{type:'array',bookType:'xlsx'})))}
async function impFile(file){
 await loadJs('https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js');
 const wb=XLSX.read(await file.arrayBuffer(),{type:'array'}),rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:''});
 const g=(r,...ks)=>{for(const k of Object.keys(r))if(ks.some(x=>k.toLowerCase().startsWith(x)))return String(r[k]).trim();return''};
 const kind=v=>{v=v.toLowerCase();return v.startsWith('гот')?'finished':v.startsWith('ингр')?'ingredient':v.startsWith('сыр')?'raw':v.startsWith('упак')||v.startsWith('этик')?'packaging':v.startsWith('полуф')||v.startsWith('смес')?'semi':v.startsWith('мат')?'material':'finished'};
 const line=v=>{v=v.toLowerCase();return/морож|джел|сорб/.test(v)?'ice':/субл/.test(v)?'subl':/орех|кедр|тыкв|семеч/.test(v)?'nuts':''};
 const unit=v=>{v=v.toLowerCase();return v==='кг'||v==='г'||v.startsWith('гр')?'g':v==='л'||v==='мл'?'ml':'pcs'};
 const items=rows.map(r=>{const name=g(r,'наимен','назв','товар');if(!name)return null;const k=kind(g(r,'вид','тип'));return{name,kind:k,line:line(g(r,'направ','катег')),sub:g(r,'подкат'),unit:k==='finished'?'pcs':unit(g(r,'ед')),net:+g(r,'масса')||0,price:+String(g(r,'цена')).replace(',','.').replace(/\s/g,'')||0,barcode:g(r,'штрих'),shelf:+g(r,'срок')||0,active:true,pack:[]}}).filter(Boolean);
 if(!items.length)throw new Error('В файле не найдено строк с наименованием');
 const exist=new Set(S.items.map(i=>i.name.toLowerCase()));const add=items.filter(i=>!exist.has(i.name.toLowerCase()));
 for(const i of add)await S.db.collection('items').doc(uid()).set(i);
 toast(`Добавлено ${add.length}, пропущено (уже есть) ${items.length-add.length}`);
}

/* ---------- Подключение к базе (Supabase) и вход ---------- */
/* Слой совместим с прежним API: db.collection(c).doc(id).set/update/delete, onSnapshot, db.doc(path).get/set */
/* Ошибки базы → понятный текст. Отказ по правам Postgres/RLS приходит с кодом 42501. */
function accessErr(e){
 const t=(e?.message||'')+' '+(e?.code||'');
 if(/42501|row-level security|permission denied/i.test(t))return new Error('Недостаточно прав для этого действия. Обратитесь к владельцу.');
 return new Error('Ошибка базы: '+(e?.message||'неизвестно'));
}
function makeDb(sb){
 const cache={};            // coll -> Map(id -> data)
 const subs={};             // coll -> [fn]
 const emit=c=>(subs[c]||[]).forEach(f=>f());
 const cmap=c=>(cache[c]??=new Map());
 const snapOf=c=>{const m=cmap(c);return {docs:[...m].map(([id,data])=>({id,data:()=>data})),metadata:{fromCache:false}}};
 const docSnap=(c,id)=>{const d=cache[c]?.get(id);return {exists:d!==undefined,data:()=>d,metadata:{fromCache:false}}};
 const loadP=(async()=>{
  let from=0;
  for(;;){
   const {data,error}=await sb.from('docs').select('coll,id,data').order('coll').order('id').range(from,from+999);
   if(error)throw error;
   for(const r of data)cmap(r.coll).set(r.id,r.data);
   if(data.length<1000)break;
   from+=1000;
  }
  sb.channel('docs-live').on('postgres_changes',{event:'*',schema:'public',table:'docs'},p=>{
   if(p.eventType==='DELETE'){if(p.old&&cache[p.old.coll]?.delete(p.old.id))emit(p.old.coll)}
   else if(p.new){cmap(p.new.coll).set(p.new.id,p.new.data);emit(p.new.coll)}
  }).subscribe();
 })();
 loadP.catch(()=>{});
 const writeDoc=async(c,id,data)=>{
  const {error}=await sb.from('docs').upsert({coll:c,id,data,updated_at:new Date().toISOString()});
  if(error)throw accessErr(error);
  cmap(c).set(id,data);emit(c);
 };
 const ref=(c,id)=>({
  set:o=>writeDoc(c,id,JSON.parse(JSON.stringify(o))),
  update:async p=>writeDoc(c,id,{...(cache[c]?.get(id)||{}),...JSON.parse(JSON.stringify(p))}),
  delete:async()=>{const {data,error}=await sb.from('docs').delete().eq('coll',c).eq('id',id).select('id');if(error)throw accessErr(error);if(!data?.length)throw new Error('Нет прав на удаление этой записи');cache[c]?.delete(id);emit(c)},
  get:async()=>{await loadP;return docSnap(c,id)},
  onSnapshot:(cb)=>{const f=()=>cb(docSnap(c,id));(subs[c]??=[]).push(f);loadP.then(f);return ()=>{}}
 });
 return {
  collection:c=>({
   doc:id=>ref(c,id),
   onSnapshot:(cb)=>{const f=()=>cb(snapOf(c));(subs[c]??=[]).push(f);loadP.then(f);return ()=>{}}
  }),
  doc:path=>{const [c,...r]=path.split('/');return ref(c,r.join('/'))},
  ready:loadP
 };
}

function showLogin(sb,cfg){
 $('#main').innerHTML=`<div class="card" style="max-width:380px;margin:40px auto"><h2 style="margin-top:0">Вход в Gelato Control</h2>
 <form id="lf" style="display:grid;gap:12px"><label>Логин<input id="lg" autocomplete="username" required></label>
 <label>Пароль<input id="lp" type="password" autocomplete="current-password" required></label>
 <div id="le" style="color:var(--bad);min-height:1.2em;font-size:14px"></div>
 <button class="btn p" type="submit">Войти</button></form></div>`;
 $('#lf').addEventListener('submit',async e=>{
  e.preventDefault();
  const l=$('#lg').value.trim();
  const email=l.includes('@')?l:l+'@'+(cfg.domain||'gelato.local');
  const {error}=await sb.auth.signInWithPassword({email,password:$('#lp').value});
  if(error){$('#le').textContent='Неверный логин или пароль';return}
  location.reload();
 });
}

(async()=>{
 S.view=location.hash.slice(1)||'home';
 const cfg=window.GELATO_CONFIG||{};
 if(!window.supabase||!cfg.url||/XXXX/.test(cfg.url)){$('#main').innerHTML='<div class="card empty">Подключение к базе не настроено. Заполните файл config.js.</div>';return}
 const sb=window.supabase.createClient(cfg.url,cfg.anonKey,{auth:{persistSession:true,autoRefreshToken:true}});
 const {data:{session}}=await sb.auth.getSession();
 if(!session){showLogin(sb,cfg);return}
 sb.auth.onAuthStateChange((ev,s)=>{if(!s)location.reload()});
 const authUser=session.user;
 const db=makeDb(sb);
 S.db=db;S.user=null;S.uid=authUser.id;
 S.owner=(authUser.email||'').toLowerCase()===String(cfg.owner||'').toLowerCase();
 const slow=setTimeout(()=>{S.err='Данные загружаются дольше обычного. Проверьте подключение к интернету.';rerender()},10000);
 const done=()=>{if(['ops','archive','cfg',...COLS].every(k=>S.loaded[k])){clearTimeout(slow);S.err=''}};
 const onErr=k=>e=>{S.loaded[k]=1;S.err=/permission|policy|42501/i.test(e.message||'')?'Нет доступа к данным. Попросите владельца добавить вас в программу.':'Ошибка загрузки: '+(e.message||e.code);done();rerender()};
 db.ready.catch(e=>{S.err=/policy|42501|permission/i.test(e.message||'')?'Нет доступа к данным. Попросите владельца добавить вас в программу.':'Не удалось загрузить данные: '+(e.message||'ошибка сети');rerender()});
 const setRole=()=>{S.role=S.owner?'owner':((S.cfg.roles||{})[S.uid]||'seller')};
 const names=()=>{S.members.forEach(x=>{S.names[x.id]=x.name||''});renderNav()};
 COLS.forEach(c=>db.collection(c).onSnapshot(s=>{S[c]=s.docs.map(d=>({id:d.id,...d.data()}));if(!s.metadata.fromCache)S.loaded[c]=1;done();if(c==='members')names();rerender()},onErr(c)));
 db.doc('cfg/main').onSnapshot(s=>{S.cfg=s.exists?s.data():{roles:{}};if(!s.metadata.fromCache)S.loaded.cfg=1;setRole();done();rerender()},onErr('cfg'));
 db.collection('ops').onSnapshot(s=>{S.ops=s.docs.map(d=>({id:d.id,...d.data()}));if(!s.metadata.fromCache)S.loaded.ops=1;rebuild();done();rerender()},onErr('ops'));
 db.collection('archive').onSnapshot(s=>{S.arch=s.docs.map(d=>d.data());if(!s.metadata.fromCache)S.loaded.archive=1;rebuild();done();rerender()},onErr('archive'));
 try{
  const me=await db.doc('members/'+S.uid).get();
  if(!me.exists)await db.doc('members/'+S.uid).set({name:(authUser.email||'').split('@')[0],joined:today()});
 }catch(e){}
 $('#who')?.addEventListener('click',()=>{if(confirm('Выйти из программы?'))sb.auth.signOut()});
 setRole();rerender();
})();
}
